<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card" id="valentineCard">
        <div class="main-heart">❤️</div>
        
        <div class="slideshow-container" id="slideshowArea">
            <img src="1.jpg" class="mySlides">
            <img src="2.jpg" class="mySlides">
            <img src="3.jpg" class="mySlides">
            <img src="4.jpg" class="mySlides">
            <img src="5.jpg" class="mySlides">
        </div>

        <div id="finalImageContainer">
            <img id="finalImg" src="" alt="Response">
            <h2 id="finalText" class="final-text"></h2>
        </div>

        <div id="mainContent">
            <h1>Happy Valentine's Day! <br> Mage Sudu Manika</h1>
            <p>You are the most beautiful part of my life and <br> I am so lucky to have you by my side.</p>
            <p><b>Will you be mine forever? 🌹</b></p>
        </div>

        <div class="btn-group" id="btnGroup">
            <button class="choice-btn" id="yesBtn" onclick="handleResponse('yes')">Yes</button>
            <button class="choice-btn" id="noBtn" onmouseover="moveNoButton()" ontouchstart="moveNoButton()">No</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
