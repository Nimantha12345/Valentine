<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffebee;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        /* Floating Hearts - Updated to stay ON TOP */
        .heart {
            position: absolute;
            color: #ff4d6d;
            font-size: 20px;
            animation: float 5s infinite linear;
            opacity: 0;
            z-index: 999; 
            pointer-events: none; 
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* Card Styling */
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            z-index: 10; 
            width: 350px;
            animation: fadeIn 2s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            color: #c9184a;
            font-size: 2rem;
            margin-top: 20px;
        }

        .main-heart {
            font-size: 60px;
            color: #ff4d6d;
            animation: beat 1s infinite alternate;
        }

        @keyframes beat {
            to { transform: scale(1.2); }
        }

        p {
            color: #590d22;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        /* Slideshow Styling */
        .slideshow-container {
            position: relative;
            height: 200px;
            width: 200px;
            margin: 20px auto;
        }

        .mySlides {
            display: none;
            border-radius: 50%;
            object-fit: cover;
            width: 100%;
            height: 100%;
            animation: fadeEffect 1s;
        }

        @keyframes fadeEffect {
            from {opacity: 0.4} 
            to {opacity: 1}
        }

        /* --- BUTTON STYLES --- */
        .btn-group {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .choice-btn {
            padding: 10px 25px;
            font-size: 1rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
            color: white;
        }

        #yesBtn { background-color: #ff4d6d; }
        
        /* No button ekata transition damma lassanata duwana widiha penna */
        #noBtn { 
            background-color: #999; 
            position: relative; 
            transition: all 0.2s ease;
        }

        /* Final Image Styling */
        #finalImageContainer {
            display: none;
            margin-top: 15px;
        }

        #finalImg {
            width: 200px;
            height: 200px;
            border-radius: 20px;
            object-fit: cover;
            animation: fadeIn 1s;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="main-heart">❤️</div>
        
        <div class="slideshow-container" id="slideshowArea">
            <img src="1.jpg" width="500px" height="500px" class="mySlides">
            <img src="2.jpg" width="500px" height="500px" class="mySlides">
            <img src="3.jpg" width="500px" height="500px" class="mySlides">
            <img src="4.jpg" width="500px" height="500px" class="mySlides">
            <img src="5.jpg" width="500px" height="500px" class="mySlides">
        </div>

        <div id="finalImageContainer">
            <img id="finalImg" src="" alt="Response">
            <h2 id="finalText" style="color: #c9184a; margin-top: 10px;"></h2>
        </div>

        <div id="mainText">
            <h1>Happy Valentine's Day! <br> Mage Sudu Manika</h1>
            <p>You are the most beautiful part of my life and <br> I am so lucky to have you by my side.<br>Thank you for filling my days with so much love and happiness.<br>I promise to love you more with every heartbeat.</p>
            <p>Will you be mine forever? 🌹</p>
        </div>

        <div class="btn-group" id="btnGroup">
            <button class="choice-btn" id="yesBtn" onclick="handleResponse('yes')">Yes</button>
            <button class="choice-btn" id="noBtn" onmouseover="moveNoButton()" onclick="handleResponse('no')">No</button>
        </div>
    </div>

    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }
        setInterval(createHeart, 300);

        let slideIndex = 0;
        let slideshowActive = true;
        showSlides();

        function showSlides() {
            if (!slideshowActive) return; 
            let slides = document.getElementsByClassName("mySlides");
            for (let i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";  
            }
            slideIndex++;
            if (slideIndex > slides.length) {slideIndex = 1}    
            slides[slideIndex-1].style.display = "block";  
            setTimeout(showSlides, 3000);
        }

        // NO button eka duwana logic eka
        function moveNoButton() {
            const noBtn = document.getElementById('noBtn');
            // Screen eke ida anuwa random thanakata button eka yawanna
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 20);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 20);
            
            noBtn.style.position = 'fixed'; // Body ekema thuna thuna duwanna
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function handleResponse(answer) {
            slideshowActive = false; 
            document.getElementById('slideshowArea').style.display = 'none';
            document.getElementById('mainText').style.display = 'none';
            document.getElementById('btnGroup').style.display = 'none';
            
            const container = document.getElementById('finalImageContainer');
            const img = document.getElementById('finalImg');
            const text = document.getElementById('finalText');
            
            container.style.display = 'block';

            if (answer === 'yes') {
                img.src = 'Hugging Hug GIF.gif'; 
                text.innerText = 'I love you so much & forever ! ❤️';
            } else {
                img.src = 'sad_image.jpg'; 
                text.innerText = 'Oh no... give me one more chance? 🥺';
            }
        }
    </script>
</body>
</html>
