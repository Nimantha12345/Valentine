<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffebee;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        /* Floating Hearts Background */
        .heart {
            position: absolute;
            color: #ff4d6d;
            font-size: 20px;
            animation: float 5s infinite linear;
            opacity: 0;
            z-index: 999; /* Higher value moves it to the front */
            pointer-events: none; /* Prevents hearts from blocking clicks/touches */
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* Card Styling */
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            z-index: 10;
            width: 350px; /* Card eka lassanata thiyaganna */
            animation: fadeIn 2s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            color: #c9184a;
            font-size: 2rem;
            margin-top: 20px;
        }

        .main-heart {
            font-size: 60px;
            color: #ff4d6d;
            animation: beat 1s infinite alternate;
        }

        @keyframes beat {
            to { transform: scale(1.2); }
        }

        p {
            color: #590d22;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        /* Slideshow Styling */
        .slideshow-container {
            position: relative;
            height: 200px;
            width: 200px;
            margin: 20px auto;
        }

        .mySlides {
            display: none; /* Okkoma photos hide karala thiyenne */
            border-radius: 50%; /* Rawum widihata thiyenna */
            object-fit: cover;
            width: 100%;
            height: 100%;
            animation: fadeEffect 1s; /* Maru weddi lassanata penna */
        }

        @keyframes fadeEffect {
            from {opacity: 0.4} 
            to {opacity: 1}
        }

    </style>
</head>
<body>

    <div class="card">
        <div class="main-heart">❤️</div>
        
        <div class="slideshow-container">
            <img src="1.jpg" width="500px" height="500px" class="mySlides">
            <img src="2.jpg" width="500px" height="500px" class="mySlides">
            <img src="3.jpg" width="500px" height="500px" class="mySlides">
            <img src="4.jpg" width="500px" height="500px" class="mySlides">
            <img src="5.jpg" width="500px" height="500px" class="mySlides">
        </div>

        <h1>Happy Valentine's Day! <br> Mage Sudu Manika</h1>
        <p>You are the most beautiful part of my life and <br> I am so lucky to have you by my side.<br>Thank you for filling my days with so much love and happiness.<br>I promise to love you more with every heartbeat.</p>
        <p>Will you be mine forever? 🌹</p>
    </div>

    <script>
        // 1. Floating Hearts Logic
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }
        setInterval(createHeart, 300);

        // 2. Slideshow Logic
        let slideIndex = 0;
        showSlides();

        function showSlides() {
            let slides = document.getElementsByClassName("mySlides");
            
            // Okkoma images hide karanna
            for (let i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";  
            }
            
            slideIndex++;
            if (slideIndex > slides.length) {
                slideIndex = 1;
            }    
            
            // Dan thiyena image eka vitharak pennanna
            slides[slideIndex-1].style.display = "block";  
            
            setTimeout(showSlides, 3000); // Thathpara 3kata serayak maru wenawa
        }
    </script>

</body>

</html>
