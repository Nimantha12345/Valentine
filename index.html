<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffebee;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* Floating Hearts Layer */
        .heart {
            position: absolute;
            color: #ff4d6d;
            font-size: 20px;
            animation: float 5s infinite linear;
            opacity: 0;
            z-index: 999; 
            pointer-events: none; 
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* Card Styling */
        .card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            z-index: 10; 
            width: 90%;
            max-width: 350px;
            animation: fadeIn 1.5s ease-in;
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 { color: #c9184a; font-size: 1.5rem; margin-top: 15px; }
        .main-heart { font-size: 50px; color: #ff4d6d; animation: beat 1s infinite alternate; }
        @keyframes beat { to { transform: scale(1.1); } }
        p { color: #590d22; font-size: 0.95rem; line-height: 1.4; padding: 0 5px; }

        /* Slideshow Styling */
        .slideshow-container {
            position: relative;
            height: 180px;
            width: 180px;
            margin: 15px auto;
        }

        .mySlides {
            display: none;
            border-radius: 50%;
            object-fit: cover;
            width: 100%;
            height: 100%;
            animation: fadeEffect 1s;
        }

        @keyframes fadeEffect { from {opacity: 0.4} to {opacity: 1} }

        /* --- BUTTON GROUP (SIDE BY SIDE) --- */
        .btn-group {
            margin-top: 25px;
            display: flex;
            justify-content: center; /* Buttons මැදට ගන්න */
            align-items: center;
            gap: 20px; /* Buttons දෙක අතර පරතරය */
            min-height: 60px;
            position: relative;
        }

        .choice-btn {
            padding: 12px 30px;
            font-size: 1rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: transform 0.2s;
            z-index: 15;
        }

        #yesBtn { background-color: #ff4d6d; }
        
        #noBtn { 
            background-color: #999; 
            position: relative; /* මුලින් සාමාන්‍ය විදිහට පේන්න */
            transition: all 0.2s ease-out;
        }

        /* Final Response View */
        #finalImageContainer { display: none; margin-top: 10px; }
        #finalImg { width: 180px; height: 180px; border-radius: 20px; object-fit: cover; }
    </style>
</head>
<body>

    <div class="card" id="valentineCard">
        <div class="main-heart">❤️</div>
        
        <div class="slideshow-container" id="slideshowArea">
            <img src="1.jpg" class="mySlides">
            <img src="2.jpg" class="mySlides">
            <img src="3.jpg" class="mySlides">
            <img src="4.jpg" class="mySlides">
            <img src="5.jpg" class="mySlides">
        </div>

        <div id="finalImageContainer">
            <img id="finalImg" src="" alt="Response">
            <h2 id="finalText" style="color: #c9184a; font-size: 1.3rem; margin-top: 10px;"></h2>
        </div>

        <div id="mainContent">
            <h1>Happy Valentine's Day! <br> Mage Sudu Manika</h1>
            <p>You are the most beautiful part of my life and <br> I am so lucky to have you by my side.</p>
            <p><b>Will you be mine forever? 🌹</b></p>
        </div>

        <div class="btn-group" id="btnGroup">
            <button class="choice-btn" id="yesBtn" onclick="handleResponse('yes')">Yes</button>
            <button class="choice-btn" id="noBtn" onmouseover="moveNoButton()" ontouchstart="moveNoButton()">No</button>
        </div>
    </div>

    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 5000);
        }
        setInterval(createHeart, 300);

        let slideIndex = 0;
        let slideshowActive = true;
        function showSlides() {
            if (!slideshowActive) return; 
            let slides = document.getElementsByClassName("mySlides");
            for (let i = 0; i < slides.length; i++) { slides[i].style.display = "none"; }
            slideIndex++;
            if (slideIndex > slides.length) {slideIndex = 1}    
            slides[slideIndex-1].style.display = "block";  
            setTimeout(showSlides, 3000);
        }
        showSlides();

        // NO Button එක පනින logic එක
        function moveNoButton() {
            const noBtn = document.getElementById('noBtn');
            
            // එක පාරක් Hover/Touch කළාම position එක fixed කරලා මුළු screen එකේම පනින්න සලස්වනවා
            noBtn.style.position = 'fixed'; 

            const padding = 50;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;
            
            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        function handleResponse(answer) {
            if (answer === 'yes') {
                slideshowActive = false; 
                document.getElementById('slideshowArea').style.display = 'none';
                document.getElementById('mainContent').style.display = 'none';
                document.getElementById('btnGroup').style.display = 'none';
                
                const container = document.getElementById('finalImageContainer');
                const img = document.getElementById('finalImg');
                const text = document.getElementById('finalText');
                
                container.style.display = 'block';
                img.src = 'Hugging Hug GIF.gif'; 
                text.innerText = 'I love you so much Suddi! ❤️';
            }
        }
    </script>
</body>
</html>
